<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>INK Bird Component</title>

  <style>
    /* =========================================================
       RESET
       ========================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(126, 110, 255, 0.10),
          transparent 26%
        ),
        linear-gradient(
          180deg,
          #f1f1f6 0%,
          #ececf2 100%
        );
    }

    :root {
      --mx: 0;
      --my: 0;
      --look-x: 0px;
      --look-y: 0px;
    }

    /* =========================================================
       STAGE
       ========================================================= */
    .stage {
      position: relative;
      width: min(520px, 88vw);
      aspect-ratio: 1 / 1.12;
      display: grid;
      place-items: center;
    }

    .glow {
      position: absolute;
      width: 58%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(
          circle,
          rgba(114, 102, 255, 0.18),
          rgba(114, 102, 255, 0.06) 42%,
          transparent 72%
        );
      filter: blur(22px);
      transform:
        translateY(-6%);
      pointer-events: none;
      z-index: 0;
    }

    .shadow {
      position: absolute;
      width: 36%;
      height: 6.5%;
      bottom: 10.5%;
      border-radius: 50%;
      background:
        radial-gradient(
          ellipse,
          rgba(16, 18, 28, 0.32),
          rgba(16, 18, 28, 0.12) 42%,
          transparent 72%
        );
      filter: blur(10px);
      z-index: 0;
      animation: shadowFloat 3.8s ease-in-out infinite;
    }

    @keyframes shadowFloat {
      0%, 100% {
        transform: scaleX(1);
        opacity: 0.75;
      }
      50% {
        transform: scaleX(1.08);
        opacity: 0.58;
      }
    }

    /* =========================================================
       BIRD WRAPPER
       ========================================================= */
    .bird-wrap {
      position: relative;
      width: 64%;
      aspect-ratio: 0.9 / 1.34;
      transform-style: preserve-3d;
      z-index: 2;
      animation: birdFloat 3.8s ease-in-out infinite;
      will-change: transform;
    }

    @keyframes birdFloat {
      0%, 100% {
        transform:
          translateY(0px)
          rotateZ(0deg);
      }
      50% {
        transform:
          translateY(-10px)
          rotateZ(-0.4deg);
      }
    }

    /* =========================================================
       SVG
       ========================================================= */
    .bird-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      filter:
        drop-shadow(0 18px 24px rgba(12, 12, 22, 0.14));
    }

    .head-group {
      transform-origin: 250px 150px;
      transition: transform 140ms ease-out;
      will-change: transform;
    }

    .iris {
      transform-origin: center;
      transition: transform 90ms linear;
      will-change: transform;
    }

    .eyelid {
      opacity: 0;
      transition: opacity 80ms ease;
    }

    .eye.blink .eyelid {
      opacity: 1;
    }

    .wing-left {
      transform-origin: 188px 230px;
      animation: leftWingIdle 3.8s ease-in-out infinite;
    }

    .wing-right {
      transform-origin: 312px 230px;
      animation: rightWingIdle 3.8s ease-in-out infinite;
    }

    @keyframes leftWingIdle {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-2.2deg);
      }
    }

    @keyframes rightWingIdle {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(2.2deg);
      }
    }

    .tail-group {
      animation: tailIdle 3.8s ease-in-out infinite;
      transform-origin: 250px 430px;
    }

    @keyframes tailIdle {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(1.4deg);
      }
    }

    /* =========================================================
       OPTIONAL LABEL
       ========================================================= */
    .label {
      position: absolute;
      bottom: -12%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(25, 28, 39, 0.34);
      white-space: nowrap;
      pointer-events: none;
    }

    /* =========================================================
       REDUCED MOTION
       ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <script>
    const headGroup = document.getElementById("headGroup");
    const leftIris = document.getElementById("leftIris");
    const rightIris = document.getElementById("rightIris");
    const eyeLeft = document.getElementById("eyeLeft");
    const eyeRight = document.getElementById("eyeRight");

    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    window.addEventListener("pointermove", (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;

      targetX = clamp(x, -1, 1);
      targetY = clamp(y, -1, 1);
    });

    document.addEventListener("mouseleave", () => {
      targetX = 0;
      targetY = 0;
    });

    function animate() {
      currentX += (targetX - currentX) * 0.08;
      currentY += (targetY - currentY) * 0.08;

      const eyeX = currentX * 5;
      const eyeY = currentY * 3.6;

      leftIris.style.transform = `translate(${eyeX}px, ${eyeY}px)`;
      rightIris.style.transform = `translate(${eyeX}px, ${eyeY}px)`;

      const headTX = currentX * 2.2;
      const headTY = currentY * 1.6;
      const headRotate = currentX * 1.4;

      headGroup.style.transform =
        `translate(${headTX}px, ${headTY}px) rotate(${headRotate}deg)`;

      requestAnimationFrame(animate);
    }

    function blink() {
      eyeLeft.classList.add("blink");
      eyeRight.classList.add("blink");

      setTimeout(() => {
        eyeLeft.classList.remove("blink");
        eyeRight.classList.remove("blink");
      }, 115);

      const next = 2400 + Math.random() * 3600;
      setTimeout(blink, next);
    }

    animate();
    setTimeout(blink, 1200);
  </script>
