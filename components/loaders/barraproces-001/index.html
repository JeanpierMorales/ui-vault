<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Progress Stepper</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <main class="page">

    <section class="process" aria-labelledby="process-title">

      <!-- HEADER -->
      <div class="process-header">

        <div>
          <p class="process-eyebrow">Proceso de configuración</p>

          <h1 id="process-title">
            Completa tu información
          </h1>

          <p class="process-description">
            Sigue los pasos para completar el proceso correctamente.
          </p>
        </div>

        <div class="progress-value" aria-live="polite">
          <span id="currentStepText">Paso 1 de 4</span>
          <strong id="percentageText">25%</strong>
        </div>

      </div>


      <!-- PROGRESS -->
      <div class="stepper">

        <!-- Línea base -->
        <div class="stepper-line"></div>

        <!-- Línea de progreso -->
        <div
          class="stepper-line-progress"
          id="progressLine"
        ></div>


        <!-- STEP 1 -->
        <button
          class="step active"
          data-step="0"
          type="button"
          aria-current="step"
        >

          <span class="step-marker">

            <span class="step-number">01</span>

            <svg
              class="step-check"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M5 12.5L9.2 16.5L19 7" />
            </svg>

          </span>

          <span class="step-content">
            <span class="step-label">Datos básicos</span>
            <span class="step-caption">Información personal</span>
          </span>

        </button>


        <!-- STEP 2 -->
        <button
          class="step"
          data-step="1"
          type="button"
        >

          <span class="step-marker">

            <span class="step-number">02</span>

            <svg
              class="step-check"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M5 12.5L9.2 16.5L19 7" />
            </svg>

          </span>

          <span class="step-content">
            <span class="step-label">Configuración</span>
            <span class="step-caption">Preferencias principales</span>
          </span>

        </button>


        <!-- STEP 3 -->
        <button
          class="step"
          data-step="2"
          type="button"
        >

          <span class="step-marker">

            <span class="step-number">03</span>

            <svg
              class="step-check"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M5 12.5L9.2 16.5L19 7" />
            </svg>

          </span>

          <span class="step-content">
            <span class="step-label">Revisión</span>
            <span class="step-caption">Comprueba tus datos</span>
          </span>

        </button>


        <!-- STEP 4 -->
        <button
          class="step"
          data-step="3"
          type="button"
        >

          <span class="step-marker">

            <span class="step-number">04</span>

            <svg
              class="step-check"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M5 12.5L9.2 16.5L19 7" />
            </svg>

          </span>

          <span class="step-content">
            <span class="step-label">Completado</span>
            <span class="step-caption">Proceso finalizado</span>
          </span>

        </button>

      </div>


      <!-- CONTENT CARD -->
      <div class="process-card">

        <div class="card-indicator">
          <span id="cardStepNumber">01</span>
        </div>


        <div
          class="card-content"
          id="cardContent"
        >

          <p class="card-overline">
            PASO ACTUAL
          </p>

          <h2 id="cardTitle">
            Datos básicos
          </h2>

          <p id="cardDescription">
            Completa la información principal necesaria para continuar con
            el proceso.
          </p>

        </div>

      </div>


      <!-- CONTROLS -->
      <div class="process-actions">

        <button
          class="button button-secondary"
          id="prevButton"
          type="button"
          disabled
        >
          <svg viewBox="0 0 24 24">
            <path d="M15 6L9 12L15 18" />
          </svg>

          Anterior
        </button>


        <button
          class="button button-primary"
          id="nextButton"
          type="button"
        >

          <span id="nextButtonText">
            Continuar
          </span>

          <svg viewBox="0 0 24 24">
            <path d="M9 6L15 12L9 18" />
          </svg>

        </button>

      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
