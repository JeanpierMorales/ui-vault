<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Ticket Card</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="stage">

    <article class="ticket" aria-labelledby="ticket-title">

      <!-- MAIN PART -->
      <div class="ticket__main">

        <div class="ticket__poster">
          <p class="ticket__kicker">Live · Horizon World Tour 2026</p>
          <h1 class="ticket__title" id="ticket-title">Aurora Nights</h1>
          <p class="ticket__support">with Selene Park &amp; The Tidewater</p>
          <span class="ticket__type">GA Floor</span>
        </div>

        <div class="ticket__info">
          <time class="ticket__date" datetime="2026-11-14T20:30">
            <span class="ticket__dow">Sat</span>
            <span class="ticket__day">14</span>
            <span class="ticket__month">Nov</span>
          </time>

          <div class="ticket__venue">
            <p class="ticket__place">Printworks London</p>
            <p class="ticket__address">Surrey Quays Rd, London SE16</p>
            <p class="ticket__time">Doors 19:00 · Show 20:30</p>
          </div>

          <dl class="ticket__seat">
            <div><dt>Gate</dt><dd>B</dd></div>
            <div><dt>Section</dt><dd>104</dd></div>
            <div><dt>Row</dt><dd>K</dd></div>
            <div><dt>Seat</dt><dd>18</dd></div>
          </dl>
        </div>

        <div class="ticket__actions">
          <button class="btn btn--ghost" type="button" data-action="calendar">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5" width="17" height="15" rx="3" />
              <path d="M3.5 10h17M8 3v4M16 3v4M12 13v4M10 15h4" />
            </svg>
            <span class="btn__label">Add to calendar</span>
          </button>
          <p class="ticket__holder">Holder <strong>Maya Chen</strong></p>
        </div>

        <!-- Shown after the stub is torn off -->
        <div class="ticket__used" aria-hidden="true">
          <span class="stamp">
            <span class="stamp__top">Admitted</span>
            <span class="stamp__time" data-used-time>20:14</span>
          </span>
        </div>
      </div>

      <!-- STUB (tears away) -->
      <div class="ticket__stub">
        <p class="ticket__admit">Admit one</p>

        <!-- QR-like pattern generated in script.js -->
        <svg class="ticket__qr" data-seed="AN-2611-0418" role="img" aria-label="Ticket code AN-2611-0418"></svg>

        <p class="ticket__code">AN-2611-0418</p>

        <button class="btn btn--primary" type="button" data-action="use">
          Use ticket
        </button>
      </div>

      <button class="btn btn--reset" type="button" data-action="reset" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.7" />
          <path d="M4 4v4.7h4.7" />
        </svg>
        Restore ticket
      </button>
    </article>

    <!-- Screen-reader announcements -->
    <p class="visually-hidden" role="status" aria-live="polite" data-status></p>

  </main>

  <script src="script.js"></script>

</body>
</html>
