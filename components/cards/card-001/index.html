<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Product Cards - Model 001</title>

  <link rel="stylesheet" href="style.css" />

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />
</head>

<body>

  <main class="page">

    <section class="products">

      <!-- =========================================
           CARD 01
      ========================================== -->

      <article class="product-card">

        <div class="shape shape-blue"></div>

        <div class="product-image-wrapper">
          <img
            class="product-image"
            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=900&q=90"
            alt="Nike Air sneaker"
          />
        </div>

        <div class="product-content">

          <h2 class="product-title">
            Nike Air
          </h2>

          <div class="product-details">

            <div class="option-row">

              <span class="option-label">
                SIZE :
              </span>

              <div class="sizes">
                <button class="size active">6</button>
                <button class="size">7</button>
                <button class="size">8</button>
                <button class="size">9</button>
              </div>

            </div>

            <div class="option-row">

              <span class="option-label">
                COLOR :
              </span>

              <div class="colors">
                <button
                  class="color color-red"
                  aria-label="Red"
                ></button>

                <button
                  class="color color-blue active"
                  aria-label="Blue"
                ></button>

                <button
                  class="color color-black"
                  aria-label="Black"
                ></button>
              </div>

            </div>

            <button class="cart-button">

              <span class="cart-fill"></span>

              <span class="cart-text">
                ADD TO CART
              </span>

            </button>

          </div>

        </div>

      </article>


      <!-- =========================================
           CARD 02
      ========================================== -->

      <article class="product-card">

        <div class="shape shape-purple"></div>

        <div class="product-image-wrapper">
          <img
            class="product-image"
            src="https://images.unsplash.com/photo-1608231387042-66d1773070a5?auto=format&fit=crop&w=900&q=90"
            alt="Sport sneaker"
          />
        </div>

        <div class="product-content">

          <h2 class="product-title">
            Air Runner
          </h2>

          <div class="product-details">

            <div class="option-row">

              <span class="option-label">
                SIZE :
              </span>

              <div class="sizes">
                <button class="size">6</button>
                <button class="size active">7</button>
                <button class="size">8</button>
                <button class="size">9</button>
              </div>

            </div>

            <div class="option-row">

              <span class="option-label">
                COLOR :
              </span>

              <div class="colors">
                <button
                  class="color color-purple active"
                  aria-label="Purple"
                ></button>

                <button
                  class="color color-white"
                  aria-label="White"
                ></button>

                <button
                  class="color color-black"
                  aria-label="Black"
                ></button>
              </div>

            </div>

            <button class="cart-button">

              <span class="cart-fill"></span>

              <span class="cart-text">
                ADD TO CART
              </span>

            </button>

          </div>

        </div>

      </article>


      <!-- =========================================
           CARD 03
      ========================================== -->

      <article class="product-card">

        <div class="shape shape-orange"></div>

        <div class="product-image-wrapper">
          <img
            class="product-image"
            src="https://images.unsplash.com/photo-1600269452121-4f2416e55c28?auto=format&fit=crop&w=900&q=90"
            alt="Nike sneaker"
          />
        </div>

        <div class="product-content">

          <h2 class="product-title">
            Urban Max
          </h2>

          <div class="product-details">

            <div class="option-row">

              <span class="option-label">
                SIZE :
              </span>

              <div class="sizes">
                <button class="size">6</button>
                <button class="size">7</button>
                <button class="size active">8</button>
                <button class="size">9</button>
              </div>

            </div>

            <div class="option-row">

              <span class="option-label">
                COLOR :
              </span>

              <div class="colors">
                <button
                  class="color color-orange active"
                  aria-label="Orange"
                ></button>

                <button
                  class="color color-blue"
                  aria-label="Blue"
                ></button>

                <button
                  class="color color-black"
                  aria-label="Black"
                ></button>
              </div>

            </div>

            <button class="cart-button">

              <span class="cart-fill"></span>

              <span class="cart-text">
                ADD TO CART
              </span>

            </button>

          </div>

        </div>

      </article>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
