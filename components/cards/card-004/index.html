<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Cards</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="profiles-page">

    <section class="profiles-grid">

      <!-- CARD 1 -->
      <article class="profile-card">

        <div class="profile-card__surface">

          <div class="profile-card__glow"></div>

          <button
            class="profile-card__share icon-button"
            type="button"
            aria-label="Compartir perfil"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 16V3" />
              <path d="M7.5 7.5 12 3l4.5 4.5" />
              <path d="M5 11v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
            </svg>
          </button>

          <div class="profile-card__top">

            <div class="profile-card__avatar">
              <img
                src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=500&q=90"
                alt="Chloe Harrison"
                draggable="false"
              />
            </div>

            <div class="profile-card__identity">
              <h2>Chloe Harrison</h2>
              <p>Product designer</p>
            </div>

            <div class="profile-card__skills">
              <span>Figma</span>
              <span>UX Design</span>
            </div>

          </div>

          <div class="profile-card__stats">

            <div class="profile-stat">
              <div class="profile-stat__value">
                <svg class="profile-stat__star" viewBox="0 0 24 24">
                  <path d="m12 2.6 2.8 5.7 6.3.9-4.55 4.44 1.08 6.27L12 16.95 6.37 19.9l1.08-6.27L2.9 9.2l6.3-.9L12 2.6Z"/>
                </svg>

                <strong>4.5</strong>
              </div>

              <span>Rating</span>
            </div>

            <div class="profile-stat">
              <strong>$15K+</strong>
              <span>Earned</span>
            </div>

            <div class="profile-stat">
              <strong>$80/hr</strong>
              <span>Rate</span>
            </div>

          </div>

          <div class="profile-card__actions">

            <button class="profile-card__contact" type="button">
              <span>Get in touch</span>

              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14" />
                <path d="m14 7 5 5-5 5" />
              </svg>
            </button>

            <button
              class="profile-card__save icon-button"
              type="button"
              aria-label="Guardar perfil"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4V4.5Z" />
              </svg>
            </button>

          </div>

        </div>

      </article>


      <!-- CARD 2 -->
      <article class="profile-card">

        <div class="profile-card__surface">

          <div class="profile-card__glow"></div>

          <button
            class="profile-card__share icon-button"
            type="button"
            aria-label="Compartir perfil"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 16V3" />
              <path d="M7.5 7.5 12 3l4.5 4.5" />
              <path d="M5 11v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
            </svg>
          </button>

          <div class="profile-card__top">

            <div class="profile-card__avatar">
              <img
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=500&q=90"
                alt="Ethan Walker"
                draggable="false"
              />
            </div>

            <div class="profile-card__identity">
              <h2>Ethan Walker</h2>
              <p>Creative developer</p>
            </div>

            <div class="profile-card__skills">
              <span>WebGL</span>
              <span>Motion</span>
            </div>

          </div>

          <div class="profile-card__stats">

            <div class="profile-stat">
              <div class="profile-stat__value">
                <svg class="profile-stat__star" viewBox="0 0 24 24">
                  <path d="m12 2.6 2.8 5.7 6.3.9-4.55 4.44 1.08 6.27L12 16.95 6.37 19.9l1.08-6.27L2.9 9.2l6.3-.9L12 2.6Z"/>
                </svg>

                <strong>4.9</strong>
              </div>

              <span>Rating</span>
            </div>

            <div class="profile-stat">
              <strong>$24K+</strong>
              <span>Earned</span>
            </div>

            <div class="profile-stat">
              <strong>$95/hr</strong>
              <span>Rate</span>
            </div>

          </div>

          <div class="profile-card__actions">

            <button class="profile-card__contact" type="button">
              <span>Get in touch</span>

              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h14" />
                <path d="m14 7 5 5-5 5" />
              </svg>
            </button>

            <button
              class="profile-card__save icon-button"
              type="button"
              aria-label="Guardar perfil"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4V4.5Z" />
              </svg>
            </button>

          </div>

        </div>

      </article>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
