<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testimonial Cards</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Reusable icons -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-star" viewBox="0 0 20 20">
      <path d="M10 1.8l2.45 5.1 5.6.72-4.1 3.9 1.04 5.56L10 14.4l-4.99 2.68 1.04-5.56-4.1-3.9 5.6-.72L10 1.8z" />
    </symbol>
    <symbol id="i-verified" viewBox="0 0 20 20">
      <path d="M10 1.5l2.1 1.5 2.6-.1.8 2.4 2.1 1.6-.8 2.5.8 2.5-2.1 1.6-.8 2.4-2.6-.1L10 18.5l-2.1-1.5-2.6.1-.8-2.4-2.1-1.6.8-2.5-.8-2.5 2.1-1.6.8-2.4 2.6.1L10 1.5z" />
      <path class="tick" d="M6.8 10.2l2.1 2.1 4.3-4.4" />
    </symbol>
  </svg>

  <main class="page">

    <header class="intro">
      <p class="intro__eyebrow">Customer stories</p>
      <h1 class="intro__title">Studios that <em>stopped juggling</em> tools</h1>
    </header>

    <section class="reviews" aria-label="Customer reviews">

      <!-- REVIEW 1 -->
      <figure class="review">
        <div class="review__stars" role="img" aria-label="Rated 5 out of 5 stars">
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
        </div>

        <blockquote class="review__quote">
          <p>
            Tessera quietly became the backbone of our studio. Briefs, feedback and
            invoices finally live in one calm place — and our clients notice.
          </p>
        </blockquote>

        <figcaption class="review__author">
          <img
            class="review__avatar"
            src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=400&q=80"
            alt="Portrait of Amara Okafor"
            width="48" height="48"
            loading="lazy"
          />
          <span class="review__who">
            <span class="review__name">
              Amara Okafor
              <span class="badge">
                <svg aria-hidden="true"><use href="#i-verified" /></svg>
                Verified
              </span>
            </span>
            <span class="review__role">Head of Design, Linework Studio</span>
          </span>
        </figcaption>
      </figure>

      <!-- REVIEW 2 (featured, expandable) -->
      <figure class="review review--featured">
        <div class="review__stars" role="img" aria-label="Rated 5 out of 5 stars">
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
        </div>

        <blockquote class="review__quote">
          <p>
            We onboarded twelve people in a single afternoon. The review flow alone
            saves us a full day every sprint.
          </p>

          <!-- Collapsible extra text: grid rows animate 0fr → 1fr -->
          <div class="review__more" id="review-more-2">
            <div class="review__more-inner">
              <p>
                What surprised me most was the support. When we hit a snag migrating
                five years of archives, their team was on a call within the hour and
                stayed until every file was in place. That's rare — and it's why we
                renewed for three years.
              </p>
            </div>
          </div>
        </blockquote>

        <button
          class="review__toggle"
          type="button"
          aria-expanded="false"
          aria-controls="review-more-2"
        >
          <span class="review__toggle-label">Read more</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" /></svg>
        </button>

        <figcaption class="review__author">
          <img
            class="review__avatar"
            src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=400&q=80"
            alt="Portrait of Daniel Reyes"
            width="48" height="48"
            loading="lazy"
          />
          <span class="review__who">
            <span class="review__name">
              Daniel Reyes
              <span class="badge">
                <svg aria-hidden="true"><use href="#i-verified" /></svg>
                Verified
              </span>
            </span>
            <span class="review__role">Founder, Harbor &amp; Pine</span>
          </span>
        </figcaption>
      </figure>

      <!-- REVIEW 3 -->
      <figure class="review">
        <div class="review__stars" role="img" aria-label="Rated 4 out of 5 stars">
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
          <svg class="star is-on" aria-hidden="true"><use href="#i-star" /></svg>
          <svg class="star" aria-hidden="true"><use href="#i-star" /></svg>
        </div>

        <blockquote class="review__quote">
          <p>
            Setup took a little patience, but once the templates clicked our weekly
            reporting went from two hours to twenty minutes.
          </p>
        </blockquote>

        <figcaption class="review__author">
          <img
            class="review__avatar"
            src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=400&q=80"
            alt="Portrait of Sofia Lindqvist"
            width="48" height="48"
            loading="lazy"
          />
          <span class="review__who">
            <span class="review__name">
              Sofia Lindqvist
              <span class="badge">
                <svg aria-hidden="true"><use href="#i-verified" /></svg>
                Verified
              </span>
            </span>
            <span class="review__role">Operations Lead, Nordvik Supply</span>
          </span>
        </figcaption>
      </figure>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
