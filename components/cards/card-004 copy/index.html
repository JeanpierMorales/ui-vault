<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium ID Card</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="scene">

    <section class="id-badge" id="idBadge">

      <!-- HANGER -->
      <div class="id-badge__hanger">
        <div class="id-badge__hanger-head"></div>

        <div class="id-badge__strap">
          <div class="id-badge__strap-shadow"></div>
          <span class="id-badge__strap-logo">(one)</span>
        </div>

        <div class="id-badge__dock"></div>
      </div>

      <!-- CARD -->
      <article class="id-card">

        <div class="id-card__shine"></div>
        <div class="id-card__noise"></div>

        <div class="id-card__top">

          <div class="id-card__photo-wrap">
            <img
              class="id-card__photo"
              src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=90"
              alt="John David"
              draggable="false"
            />
          </div>

          <div class="id-card__main-info">
            <h2 class="id-card__name">John David / 38 yr</h2>
          </div>

          <div class="id-card__meta">
            <p><span>Role:</span> HR</p>
            <p><span>Branch:</span> Texas</p>
            <p><span>ID no:</span> 32544585</p>
          </div>

        </div>

        <div class="id-card__divider"></div>

        <div class="id-card__bottom">
          <p class="id-card__email">info@onepage.com</p>
          <h1 class="id-card__brand">one(page)</h1>
        </div>

      </article>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
