<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Button System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="button-library">

    <!-- ================================================== -->
    <!-- MASTER -->
    <!-- ================================================== -->

    <section class="button-row">

      <button class="btn btn-text btn-neutral">
        Master
      </button>

      <button class="btn btn-outline btn-neutral">
        Master
      </button>

      <button class="btn btn-soft btn-neutral">
        Master
      </button>

      <button class="btn btn-solid btn-neutral">
        Master
      </button>

    </section>


    <!-- ================================================== -->
    <!-- HOVER -->
    <!-- ================================================== -->

    <section class="button-row">

      <button class="btn btn-hover-demo">
        Hover
      </button>

      <button class="btn btn-hover-outline">
        Hover
      </button>

      <button class="btn btn-hover-soft">
        Hover
      </button>

      <button class="btn btn-hover-solid">
        Hover
      </button>

    </section>


    <!-- ================================================== -->
    <!-- BACK -->
    <!-- ================================================== -->

    <section class="button-row">

      <button class="btn btn-text btn-primary">
        <span class="icon">←</span>
        Back
      </button>

      <button class="btn btn-outline btn-primary">
        <span class="icon">←</span>
        Back
      </button>

      <button class="btn btn-soft btn-primary">
        <span class="icon">←</span>
        Back
      </button>

      <button class="btn btn-solid btn-primary">
        <span class="icon">←</span>
        Back
      </button>

    </section>


    <!-- ================================================== -->
    <!-- NEXT -->
    <!-- ================================================== -->

    <section class="button-row">

      <button class="btn btn-text btn-primary">
        Next
        <span class="icon">→</span>
      </button>

      <button class="btn btn-outline btn-primary">
        Next
        <span class="icon">→</span>
      </button>

      <button class="btn btn-soft btn-primary">
        Next
        <span class="icon">→</span>
      </button>

      <button class="btn btn-solid btn-primary">
        Next
        <span class="icon">→</span>
      </button>

    </section>


    <!-- ================================================== -->
    <!-- SUBMIT -->
    <!-- ================================================== -->

    <section class="button-row">

      <button class="btn btn-text btn-success">
        <span class="icon">✓</span>
        Submit
      </button>

      <button class="btn btn-outline btn-success">
        <span class="icon">✓</span>
        Submit
      </button>

      <button class="btn btn-soft btn-success">
        <span class="icon">✓</span>
        Submit
      </button>

      <button class="btn btn-solid btn-success">
        <span class="icon">✓</span>
        Submit
      </button>

    </section>


    <!-- ================================================== -->
    <!-- CANCEL -->
    <!-- ================================================== -->

    <section class="button-row">

      <button class="btn btn-text btn-danger">
        <span class="icon">×</span>
        Cancel
      </button>

      <button class="btn btn-outline btn-danger">
        <span class="icon">×</span>
        Cancel
      </button>

      <button class="btn btn-soft btn-danger">
        <span class="icon">×</span>
        Cancel
      </button>

      <button class="btn btn-solid btn-danger">
        <span class="icon">×</span>
        Cancel
      </button>

    </section>


    <!-- ================================================== -->
    <!-- DELETE -->
    <!-- ================================================== -->

    <section class="button-row">

      <button class="btn btn-text btn-warning">
        <span class="icon icon-trash">⌫</span>
        Delete
      </button>

      <button class="btn btn-outline btn-warning">
        <span class="icon icon-trash">⌫</span>
        Delete
      </button>

      <button class="btn btn-soft btn-warning">
        <span class="icon icon-trash">⌫</span>
        Delete
      </button>

      <button class="btn btn-solid btn-warning">
        <span class="icon icon-trash">⌫</span>
        Delete
      </button>

    </section>


    <!-- ================================================== -->
    <!-- ADD -->
    <!-- ================================================== -->

    <section class="button-row">

      <button class="btn btn-text btn-primary">
        <span class="icon icon-plus">+</span>
        Add
      </button>

      <button class="btn btn-outline btn-primary">
        <span class="icon icon-plus">+</span>
        Add
      </button>

      <button class="btn btn-soft btn-primary">
        <span class="icon icon-plus">+</span>
        Add
      </button>

      <button class="btn btn-solid btn-primary">
        <span class="icon icon-plus">+</span>
        Add
      </button>

    </section>


    <!-- ================================================== -->
    <!-- EDIT -->
    <!-- ================================================== -->

    <section class="button-row">

      <button class="btn btn-text btn-primary">
        <span class="icon icon-pencil">✎</span>
        Edit
      </button>

      <button class="btn btn-outline btn-primary">
        <span class="icon icon-pencil">✎</span>
        Edit
      </button>

      <button class="btn btn-soft btn-primary">
        <span class="icon icon-pencil">✎</span>
        Edit
      </button>

      <button class="btn btn-solid btn-primary">
        <span class="icon icon-pencil">✎</span>
        Edit
      </button>

    </section>


    <!-- ================================================== -->
    <!-- EXPAND -->
    <!-- ================================================== -->

    <section class="button-row">

      <button class="btn btn-text btn-primary">
        <span class="icon icon-chevron">⌄</span>
        Expand
      </button>

      <button class="btn btn-outline btn-primary">
        <span class="icon icon-chevron">⌄</span>
        Expand
      </button>

      <button class="btn btn-soft btn-primary">
        <span class="icon icon-chevron">⌄</span>
        Expand
      </button>

      <button class="btn btn-solid btn-primary">
        <span class="icon icon-chevron">⌄</span>
        Expand
      </button>

    </section>


    <!-- ================================================== -->
    <!-- DATE -->
    <!-- ================================================== -->

    <section class="button-row">

      <button class="btn btn-text btn-primary">
        <span class="icon icon-date">▣</span>
        Date
      </button>

      <button class="btn btn-outline btn-primary">
        <span class="icon icon-date">▣</span>
        Date
      </button>

      <button class="btn btn-soft btn-primary">
        <span class="icon icon-date">▣</span>
        Date
      </button>

      <button class="btn btn-solid btn-primary">
        <span class="icon icon-date">▣</span>
        Date
      </button>

    </section>


    <!-- ================================================== -->
    <!-- MORE -->
    <!-- ================================================== -->

    <section class="button-row">

      <button class="btn btn-text btn-primary">
        <span class="icon icon-more">⋮</span>
        More
      </button>

      <button class="btn btn-outline btn-primary">
        <span class="icon icon-more">⋮</span>
        More
      </button>

      <button class="btn btn-soft btn-primary">
        <span class="icon icon-more">⋮</span>
        More
      </button>

      <button class="btn btn-solid btn-primary">
        <span class="icon icon-more">⋮</span>
        More
      </button>

    </section>


    <!-- ================================================== -->
    <!-- OPEN -->
    <!-- ================================================== -->

    <section class="button-row">

      <button class="btn btn-text btn-primary">
        Open
        <span class="icon icon-open">↗</span>
      </button>

      <button class="btn btn-outline btn-primary">
        Open
        <span class="icon icon-open">↗</span>
      </button>

      <button class="btn btn-soft btn-primary">
        Open
        <span class="icon icon-open">↗</span>
      </button>

      <button class="btn btn-solid btn-primary">
        Open
        <span class="icon icon-open">↗</span>
      </button>

    </section>

  </main>

</body>
</html>
