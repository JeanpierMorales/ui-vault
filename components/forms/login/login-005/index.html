<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Glass Navigation</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="page">
      <!-- =====================================================
         NAVBAR
    ====================================================== -->

      <nav class="glass-nav" id="glassNav">
        <!-- BRAND -->
        <a href="#inicio" class="brand-button" aria-label="Ir al inicio">
          <span class="brand-symbol">
            <span class="brand-circle brand-circle-main"></span>

            <span class="brand-circle brand-circle-small"></span>

            <span class="brand-circle brand-circle-mini"></span>
          </span>
        </a>

        <!-- MENU -->
        <div class="nav-menu" id="navMenu">
          <!-- selector deslizante -->
          <span
            class="nav-indicator"
            id="navIndicator"
            aria-hidden="true"
          ></span>

          <a href="#inicio" class="nav-item active" data-nav> Inicio </a>

          <a href="#pricing" class="nav-item" data-nav> Pricing </a>

          <a href="#nosotros" class="nav-item" data-nav> Quiénes somos </a>

          <a href="#servicios" class="nav-item" data-nav> Servicios </a>

          <a href="#recursos" class="nav-item" data-nav> Recursos </a>

          <a href="#contacto" class="nav-item" data-nav> Contacto </a>
        </div>

        <!-- DIVIDER -->
        <div class="nav-divider"></div>

        <!-- CTA -->
        <a href="#contacto" class="nav-cta">
          <span class="cta-label"> Hablemos </span>

          <span class="cta-arrow">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </span>
        </a>
      </nav>

      <!-- =====================================================
         SECCIONES DEMO
    ====================================================== -->

      <section id="inicio" class="section section-light">
        <div class="section-content">
          <span class="section-number"> 01 </span>

          <h1>Inicio</h1>

          <p>Scroll para probar la navegación.</p>
        </div>
      </section>

      <section id="pricing" class="section section-soft">
        <div class="section-content">
          <span class="section-number"> 02 </span>

          <h2>Pricing</h2>
        </div>
      </section>

      <section id="nosotros" class="section section-light">
        <div class="section-content">
          <span class="section-number"> 03 </span>

          <h2>Quiénes somos</h2>
        </div>
      </section>

      <section id="servicios" class="section section-soft">
        <div class="section-content">
          <span class="section-number"> 04 </span>

          <h2>Servicios</h2>
        </div>
      </section>

      <section id="recursos" class="section section-light">
        <div class="section-content">
          <span class="section-number"> 05 </span>

          <h2>Recursos</h2>
        </div>
      </section>

      <section id="contacto" class="section section-dark">
        <div class="section-content">
          <span class="section-number"> 06 </span>

          <h2>Contacto</h2>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
