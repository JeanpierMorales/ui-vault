<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Process Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <main class="page">

    <section class="tracking-card">

      <!-- HEADER -->
      <header class="tracking-header">

        <div class="tracking-title">
          <span class="tracking-label">PROCESO</span>

          <h1>
            Solicitud
            <span>#A2841</span>
          </h1>
        </div>


        <div class="tracking-status">

          <span>Estado actual</span>

          <strong id="currentStatus">
            En revisión
          </strong>

        </div>

      </header>


      <!-- PROGRESS -->
      <div class="progress-area">

        <div class="progress-track">

          <div class="progress-base"></div>

          <div
            class="progress-fill"
            id="progressFill"
          ></div>


          <!-- STEP 1 -->
          <button
            class="progress-step completed"
            data-step="0"
            type="button"
          >
            <span class="dot">

              <span class="dot-number">
                1
              </span>

              <i class="fa-solid fa-check"></i>

            </span>
          </button>


          <!-- STEP 2 -->
          <button
            class="progress-step active"
            data-step="1"
            type="button"
          >
            <span class="dot">

              <span class="dot-number">
                2
              </span>

              <i class="fa-solid fa-check"></i>

            </span>
          </button>


          <!-- STEP 3 -->
          <button
            class="progress-step"
            data-step="2"
            type="button"
          >
            <span class="dot">

              <span class="dot-number">
                3
              </span>

              <i class="fa-solid fa-check"></i>

            </span>
          </button>


          <!-- STEP 4 -->
          <button
            class="progress-step"
            data-step="3"
            type="button"
          >
            <span class="dot">

              <span class="dot-number">
                4
              </span>

              <i class="fa-solid fa-check"></i>

            </span>
          </button>

        </div>


        <!-- LABELS -->
        <div class="step-details">


          <!-- ITEM 1 -->
          <article
            class="step-detail completed"
            data-detail="0"
          >

            <div class="detail-icon">
              <i class="fa-regular fa-clipboard"></i>
            </div>

            <div>
              <strong>
                Solicitud recibida
              </strong>

              <span>
                Información registrada
              </span>
            </div>

          </article>


          <!-- ITEM 2 -->
          <article
            class="step-detail active"
            data-detail="1"
          >

            <div class="detail-icon">
              <i class="fa-solid fa-file-shield"></i>
            </div>

            <div>
              <strong>
                En revisión
              </strong>

              <span>
                Validando información
              </span>
            </div>

          </article>


          <!-- ITEM 3 -->
          <article
            class="step-detail"
            data-detail="2"
          >

            <div class="detail-icon">
              <i class="fa-regular fa-paper-plane"></i>
            </div>

            <div>
              <strong>
                Procesamiento
              </strong>

              <span>
                Gestión en curso
              </span>
            </div>

          </article>


          <!-- ITEM 4 -->
          <article
            class="step-detail"
            data-detail="3"
          >

            <div class="detail-icon">
              <i class="fa-solid fa-circle-check"></i>
            </div>

            <div>
              <strong>
                Finalizado
              </strong>

              <span>
                Proceso completado
              </span>
            </div>

          </article>

        </div>

      </div>


      <!-- FOOTER -->
      <footer class="tracking-footer">

        <div>

          <span>
            Progreso del proceso
          </span>

          <strong id="progressPercentage">
            50%
          </strong>

        </div>


        <div class="controls">

          <button
            id="prevBtn"
            class="control-btn secondary"
            type="button"
          >

            <i class="fa-solid fa-arrow-left"></i>

            Anterior

          </button>


          <button
            id="nextBtn"
            class="control-btn primary"
            type="button"
          >

            Continuar

            <i class="fa-solid fa-arrow-right"></i>

          </button>

        </div>

      </footer>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
