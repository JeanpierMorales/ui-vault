<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Books Section</title>

  <link rel="stylesheet" href="style.css" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  />
</head>

<body>

  <main class="page">

    <section class="books-section">

      <div class="books-header">
        <h2>Popular Now</h2>

        <button class="more-button" type="button" aria-label="More options">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
      </div>

      <div class="books-grid">

        <!-- BOOK 01 -->
        <article class="book-card">

          <div class="book-cover-wrap">
            <img
              class="book-cover"
              src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=700&q=90"
              alt="Book cover"
            />
          </div>

          <div class="book-info">
            <h3>The World of Ice and Fire</h3>
            <p>George R. R. Martin</p>
          </div>

        </article>


        <!-- BOOK 02 -->
        <article class="book-card">

          <div class="book-cover-wrap">
            <img
              class="book-cover"
              src="https://images.unsplash.com/photo-1543002588-bfa74002ed7e?auto=format&fit=crop&w=700&q=90"
              alt="Book cover"
            />
          </div>

          <div class="book-info">
            <h3>Fantastic Beasts</h3>
            <p>Volume II</p>
          </div>

        </article>


        <!-- BOOK 03 -->
        <article class="book-card">

          <div class="book-cover-wrap">
            <img
              class="book-cover"
              src="https://images.unsplash.com/photo-1535905557558-afc4877a26fc?auto=format&fit=crop&w=700&q=90"
              alt="Book cover"
            />
          </div>

          <div class="book-info">
            <h3>Game of Thrones</h3>
            <p>Volume III</p>
          </div>

        </article>


        <!-- BOOK 04 -->
        <article class="book-card">

          <div class="book-cover-wrap">
            <img
              class="book-cover"
              src="https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=700&q=90"
              alt="Book cover"
            />
          </div>

          <div class="book-info">
            <h3>The Wise Man's Fear</h3>
            <p>Patrick Rothfuss</p>
          </div>

        </article>


        <!-- ADD BOOK -->
        <button class="add-book-card" type="button">

          <div class="add-book-shape">

            <div class="book-spine"></div>

            <div class="add-icon">
              <i class="fa-solid fa-plus"></i>
            </div>

          </div>

          <span class="add-book-label">
            Add book
          </span>

        </button>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
