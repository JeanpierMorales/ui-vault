<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pricing Plans</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <main>

    <section class="pricing">

      <!-- ===============================
           HEADER
      ================================ -->

      <header class="pricing__header">

        <div class="pricing__intro">
          <h1>Pricing Plans.</h1>

        
        </div>

        <span class="pricing__index">(01)</span>

      </header>


      <!-- ===============================
           PLAN SELECTOR
      ================================ -->

      <div class="pricing__selector-wrapper">

        <div
          class="plan-selector"
          role="tablist"
          aria-label="Pricing plans"
        >

          <span class="plan-selector__indicator"></span>

          <button
            class="plan-selector__button is-active"
            data-plan="free"
            role="tab"
            aria-selected="true"
          >
            Free
          </button>

          <button
            class="plan-selector__button"
            data-plan="pro"
            role="tab"
            aria-selected="false"
          >
            Pro
          </button>

          <button
            class="plan-selector__button"
            data-plan="studio"
            role="tab"
            aria-selected="false"
          >
            Studio
          </button>

        </div>

      </div>


      <!-- ===============================
           PRICING CARD
      ================================ -->

      <article class="pricing-card">

        <!-- LEFT SIDE -->

        <div class="pricing-card__left">

          <div class="pricing-card__left-content">

            <div class="pricing-card__top">

              <span
                class="pricing-card__type"
                data-plan-type
              >
                Free Plan
              </span>

              <span class="pricing-card__brand">
                KANZO©
              </span>

            </div>


            <!-- PRICE -->

            <div class="pricing-card__price">

              <span
                class="pricing-card__amount"
                data-plan-price
              >
                $0
              </span>

              <span
                class="pricing-card__period"
                data-plan-period
              >
                /month
              </span>

            </div>


            <!-- DESCRIPTION -->

            <p
              class="pricing-card__description"
              data-plan-description
            >
              Explore the essentials and get started
              with the core experience.
            </p>

          </div>


          <!-- BOTTOM INFO -->

          <div class="pricing-card__meta">

            <span class="pricing-card__meta-icon">
              +
            </span>

            <span data-plan-meta>
              No credit card required.
            </span>

          </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="pricing-card__right">

          <div class="pricing-card__features">

            <p class="pricing-card__label">
              What's included:
            </p>

            <ul
              class="feature-list"
              data-feature-list
            >
              <!-- JS -->
            </ul>

          </div>


          <div class="pricing-card__footer">

            <div class="pricing-card__delivery">

              <span>
                Estimated setup:
              </span>

              <strong data-plan-delivery>
                Instant
              </strong>

            </div>


            <button class="pricing-card__cta">

              <span data-plan-cta>
                Get started
              </span>

              <span class="pricing-card__cta-icon">
                +
              </span>

            </button>

          </div>

        </div>

      </article>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
