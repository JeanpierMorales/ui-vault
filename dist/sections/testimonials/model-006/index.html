<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Community Testimonials</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main>

    <section
      class="community-testimonials"
      id="community-testimonials"
      aria-labelledby="community-title"
    >

      <div class="community-testimonials__inner">

        <!-- LEFT -->
        <div class="community-testimonials__intro">

          <h2
            class="community-testimonials__title"
            id="community-title"
          >
            From our
            <strong>community.</strong>
          </h2>

          <p class="community-testimonials__description">
            Here’s what other subscribers had to say
            about Production Online.
          </p>

          <div class="community-testimonials__controls">

            <button
              class="community-testimonials__button community-testimonials__button--prev"
              type="button"
              aria-label="Previous testimonial"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M19 12H5"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />

                <path
                  d="M11 6L5 12L11 18"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>


            <button
              class="community-testimonials__button community-testimonials__button--next"
              type="button"
              aria-label="Next testimonial"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
              >
                <path
                  d="M5 12H19"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />

                <path
                  d="M13 6L19 12L13 18"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

          </div>

        </div>


        <!-- RIGHT -->
        <div class="community-testimonials__stage">

          <article
            class="community-testimonial"
            aria-live="polite"
          >

            <div
              class="community-testimonial__quote-mark"
              aria-hidden="true"
            >
              “
            </div>


            <blockquote class="community-testimonial__quote">
              Production Online has helped me become a better
              musician and producer than I ever thought possible.”
            </blockquote>


            <footer class="community-testimonial__author">

              <div class="community-testimonial__avatar-wrap">

                <img
                  class="community-testimonial__avatar"
                  src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=90"
                  alt="Kyle Weznick"
                  draggable="false"
                />

              </div>


              <div class="community-testimonial__author-info">

                <strong>
                  Kyle Weznick
                </strong>

                <span>
                  Media Director, Turn Around Music Group
                </span>

              </div>

            </footer>


            <div
              class="community-testimonials__progress"
              aria-hidden="true"
            >
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>

          </article>

        </div>

      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
