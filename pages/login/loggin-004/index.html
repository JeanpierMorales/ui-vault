<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login / Register Transition</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="auth-wrapper">

    <section class="auth-container" id="authContainer">

      <!-- =========================
           SIGN IN
      ========================== -->

      <div class="form-panel sign-in-panel">

        <div class="form-content">

          <h1>Sign in to Website</h1>

          <div class="social-buttons">

            <button
              class="social-button"
              type="button"
              aria-label="Facebook"
            >
              f
            </button>

            <button
              class="social-button"
              type="button"
              aria-label="LinkedIn"
            >
              in
            </button>

            <button
              class="social-button"
              type="button"
              aria-label="X"
            >
              X
            </button>

          </div>

          <p class="form-description">
            OR USE YOUR EMAIL ACCOUNT
          </p>

          <div class="fields">

            <div class="input-group">
              <input
                type="email"
                placeholder="Email"
              />
            </div>

            <div class="input-group">
              <input
                type="password"
                placeholder="Password"
              />
            </div>

          </div>

          <a href="#" class="forgot-password">
            Forgot your password?
          </a>

          <button
            class="primary-button"
            type="button"
          >
            SIGN IN
          </button>

        </div>

      </div>


      <!-- =========================
           SIGN UP
      ========================== -->

      <div class="form-panel sign-up-panel">

        <div class="form-content">

          <h1>Create Account</h1>

          <div class="social-buttons">

            <button
              class="social-button"
              type="button"
              aria-label="Facebook"
            >
              f
            </button>

            <button
              class="social-button"
              type="button"
              aria-label="LinkedIn"
            >
              in
            </button>

            <button
              class="social-button"
              type="button"
              aria-label="X"
            >
              X
            </button>

          </div>

          <p class="form-description">
            OR USE EMAIL FOR REGISTRATION
          </p>

          <div class="fields">

            <div class="input-group">
              <input
                type="text"
                placeholder="Name"
              />
            </div>

            <div class="input-group">
              <input
                type="email"
                placeholder="Email"
              />
            </div>

            <div class="input-group">
              <input
                type="password"
                placeholder="Password"
              />
            </div>

          </div>

          <button
            class="primary-button"
            type="button"
          >
            SIGN UP
          </button>

        </div>

      </div>


      <!-- =========================
           SLIDING OVERLAY
      ========================== -->

      <div class="overlay-container">

        <div class="overlay">

          <!-- overlay left -->
          <div class="overlay-panel overlay-left">

            <div class="decor-circle decor-circle-top"></div>
            <div class="decor-circle decor-circle-bottom"></div>

            <div class="overlay-content">

              <h2>
                Welcome Back !
              </h2>

              <p>
                To keep connected with us please login
                with your personal info
              </p>

              <button
                class="ghost-button"
                id="signInButton"
                type="button"
              >
                SIGN IN
              </button>

            </div>

          </div>


          <!-- overlay right -->
          <div class="overlay-panel overlay-right">

            <div class="decor-circle decor-circle-top"></div>
            <div class="decor-circle decor-circle-bottom"></div>

            <div class="overlay-content">

              <h2>
                Hello Friend !
              </h2>

              <p>
                Enter your personal details and start
                journey with us
              </p>

              <button
                class="ghost-button"
                id="signUpButton"
                type="button"
              >
                SIGN UP
              </button>

            </div>

          </div>

        </div>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
