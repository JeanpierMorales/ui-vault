<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login 001 - Split Screen</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="login">

    <section class="login__visual">

      <div class="login__visual-content">
        <span class="login__badge">UI Vault</span>

        <h1>Welcome back.</h1>

        <p>
          A reusable split-screen login component built with pure HTML,
          CSS and JavaScript.
        </p>
      </div>

    </section>

    <section class="login__form-section">

      <form class="login__form" id="loginForm">

        <div class="login__header">
          <h2>Sign in</h2>
          <p>Enter your credentials to continue.</p>
        </div>

        <div class="field">
          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            placeholder="name@example.com"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          >
        </div>

        <div class="login__options">

          <label class="remember">
            <input type="checkbox">
            Remember me
          </label>

          <a href="#">Forgot password?</a>

        </div>

        <button type="submit" class="login__button">
          Sign in
        </button>

        <p class="login__register">
          Don't have an account?
          <a href="#">Create one</a>
        </p>

      </form>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
