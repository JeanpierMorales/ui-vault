<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KANZO Laptop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="laptop-section">
  <div class="scene">

    <div class="laptop">

      <!-- ═══════════════ DISPLAY ═══════════════ -->
      <div class="display">
        <div class="display-shell">

          <div class="camera">
            <span></span>
          </div>

          <div class="screen">
            <div class="reflection"></div>

            <!-- Browser -->
            <div class="browser">
              <div class="browser-left">
                <i></i><i></i><i></i>
              </div>

              <div class="browser-address">kanzo.studio</div>

              <div class="browser-more">•••</div>
            </div>

            <!-- Website -->
            <div class="website">

              <nav class="nav">
                <div class="logo">
                  <span class="logo-symbol"></span>
                  KANZO
                </div>

                <div class="links">
                  <a>Work</a>
                  <a>Studio</a>
                  <a>Services</a>
                  <button>Start project</button>
                </div>
              </nav>

              <main class="website-hero">

                <div class="copy">
                  <span class="overline">DIGITAL STUDIO · LIMA</span>

                  <h1>
                    Digital products<br>
                    with <em>purpose.</em>
                  </h1>

                  <p>
                    Web experiences, software and intelligent systems
                    designed with clarity.
                  </p>

                  <div class="actions">
                    <a>Explore work ↗</a>
                    <span>Scroll to discover</span>
                  </div>
                </div>

                <div class="visual">
                  <div class="sun"></div>

                  <svg viewBox="0 0 700 500" preserveAspectRatio="none">
                    <polygon class="mountain m1"
                      points="0,500 0,350 145,230 240,295 365,135 470,250 560,165 700,315 700,500"/>

                    <polygon class="mountain m2"
                      points="0,500 95,330 200,390 355,205 470,335 595,250 700,350 700,500"/>
                  </svg>

                  <div class="visual-caption">
                    <span>01</span>
                    <b>Selected<br>experience</b>
                  </div>
                </div>

              </main>

              <footer class="website-footer">
                <span>Web Design</span>
                <span>Development</span>
                <span>Artificial Intelligence</span>
              </footer>

            </div>
          </div>
        </div>

        <div class="display-bottom"></div>
      </div>

      <!-- ═══════════════ HINGE ═══════════════ -->
      <div class="hinge">
        <div></div>
      </div>

      <!-- ═══════════════ BASE ═══════════════ -->
      <div class="base">

        <div class="deck">

          <!-- KEYBOARD -->
          <div class="keyboard">

            <!-- FUNCTION ROW -->
            <div class="key-row function-row">
              <button class="key esc"><small>esc</small></button>
              <button class="key fn">F1</button>
              <button class="key fn">F2</button>
              <button class="key fn">F3</button>
              <button class="key fn">F4</button>
              <button class="key fn">F5</button>
              <button class="key fn">F6</button>
              <button class="key fn">F7</button>
              <button class="key fn">F8</button>
              <button class="key fn">F9</button>
              <button class="key fn">F10</button>
              <button class="key fn">F11</button>
              <button class="key fn">F12</button>
              <button class="key power"><span></span></button>
            </div>

            <!-- NUMBER ROW -->
            <div class="key-row">
              <button class="key">
                <small>~</small><span>`</span>
              </button>

              <button class="key"><small>!</small><span>1</span></button>
              <button class="key"><small>@</small><span>2</span></button>
              <button class="key"><small>#</small><span>3</span></button>
              <button class="key"><small>$</small><span>4</span></button>
              <button class="key"><small>%</small><span>5</span></button>
              <button class="key"><small>^</small><span>6</span></button>
              <button class="key"><small>&</small><span>7</span></button>
              <button class="key"><small>*</small><span>8</span></button>
              <button class="key"><small>(</small><span>9</span></button>
              <button class="key"><small>)</small><span>0</span></button>
              <button class="key"><small>—</small><span>-</span></button>
              <button class="key"><small>+</small><span>=</span></button>
              <button class="key delete">delete</button>
            </div>

            <!-- QWERTY -->
            <div class="key-row">
              <button class="key tab left">tab</button>

              <button class="key">Q</button>
              <button class="key">W</button>
              <button class="key">E</button>
              <button class="key">R</button>
              <button class="key">T</button>
              <button class="key">Y</button>
              <button class="key">U</button>
              <button class="key">I</button>
              <button class="key">O</button>
              <button class="key">P</button>
              <button class="key"><small>{</small><span>[</span></button>
              <button class="key"><small>}</small><span>]</span></button>

              <button class="key slash">
                <small>|</small><span>\</span>
              </button>
            </div>

            <!-- HOME -->
            <div class="key-row">
              <button class="key caps left">caps lock</button>

              <button class="key">A</button>
              <button class="key">S</button>
              <button class="key">D</button>
              <button class="key">F</button>
              <button class="key">G</button>
              <button class="key">H</button>
              <button class="key">J</button>
              <button class="key">K</button>
              <button class="key">L</button>
              <button class="key"><small>:</small><span>;</span></button>
              <button class="key"><small>"</small><span>'</span></button>

              <button class="key return">return</button>
            </div>

            <!-- SHIFT -->
            <div class="key-row">
              <button class="key shift left">shift</button>

              <button class="key">Z</button>
              <button class="key">X</button>
              <button class="key">C</button>
              <button class="key">V</button>
              <button class="key">B</button>
              <button class="key">N</button>
              <button class="key">M</button>
              <button class="key"><small>&lt;</small><span>,</span></button>
              <button class="key"><small>&gt;</small><span>.</span></button>
              <button class="key"><small>?</small><span>/</span></button>

              <button class="key shift shift-right">shift</button>
            </div>

            <!-- BOTTOM -->
            <div class="key-row bottom-row">

              <button class="key modifier left">
                <small>fn</small>
              </button>

              <button class="key modifier">
                <small>control</small>
              </button>

              <button class="key modifier">
                <small>option</small>
              </button>

              <button class="key command">
                <small>⌘</small>
                <span>command</span>
              </button>

              <button class="key space"></button>

              <button class="key command">
                <small>⌘</small>
                <span>command</span>
              </button>

              <button class="key modifier">
                <small>option</small>
              </button>

              <div class="arrows">
                <button class="key arrow up">▲</button>

                <div>
                  <button class="key arrow">◀</button>
                  <button class="key arrow">▼</button>
                  <button class="key arrow">▶</button>
                </div>
              </div>

            </div>

          </div>

          <!-- TRACKPAD -->
          <div class="trackpad">
            <div class="trackpad-light"></div>
          </div>

        </div>

        <div class="front-edge">
          <div class="opening"></div>
        </div>

      </div>

    </div>

    <div class="ground-shadow"></div>

  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="script.js"></script>

</body>
</html>
