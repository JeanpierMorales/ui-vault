<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Motion Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Montserrat:wght@800&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <a class="site-mark" href="../index.html" aria-label="Volver a UI Vault">2D</a>

      <div class="header-title">
        <h1>Motion library.</h1>
        <p>9 personajes · 6 fotogramas por loop</p>
      </div>

      <button class="playback-button" type="button" data-playback aria-pressed="false">
        <span data-playback-label>Pausar todos</span>
      </button>
    </header>

    <main class="motion-board" aria-label="2D animation viewer">
      <section class="model-column" aria-labelledby="fox-title">
        <header class="model-heading">
          <span>Modelo 001</span>
          <h2 id="fox-title">Foxes</h2>
        </header>

        <div class="motion-list">
          <article class="motion-stage" data-sequence data-frames="model-001/zorro1/zorroUno1.png|model-001/zorro1/zorroUno2.png|model-001/zorro1/zorroUno3.png|model-001/zorro1/zorroUno4.png|model-001/zorro1/zorroUno5.png|model-001/zorro1/zorroUno6.png">
            <img src="model-001/zorro1/zorroUno1.png" alt="Fox, version one" />
            <footer><span>Zorro 01</span><span>01—06</span></footer>
          </article>
          <article class="motion-stage" data-sequence data-frames="model-001/zorro2/zorroDos1.png|model-001/zorro2/zorroDos2.png|model-001/zorro2/zorroDos3.png|model-001/zorro2/zorroDos4.png|model-001/zorro2/zorroDos5.png|model-001/zorro2/zorroDos6.png">
            <img src="model-001/zorro2/zorroDos1.png" alt="Fox, version two" />
            <footer><span>Zorro 02</span><span>01—06</span></footer>
          </article>
        </div>
      </section>

      <section class="model-column" aria-labelledby="raven-title">
        <header class="model-heading">
          <span>Modelo 002</span>
          <h2 id="raven-title">Ravens</h2>
        </header>

        <div class="motion-list">
          <article class="motion-stage" data-sequence data-frames="model-002/cuervo1/cuervo1.png|model-002/cuervo1/cuervo2.png|model-002/cuervo1/cuervo3.png|model-002/cuervo1/cuervo4.png|model-002/cuervo1/cuervo5.png|model-002/cuervo1/cuervo6.png">
            <img src="model-002/cuervo1/cuervo1.png" alt="Raven, version one" />
            <footer><span>Cuervo 01</span><span>01—06</span></footer>
          </article>
          <article class="motion-stage" data-sequence data-frames="model-002/cuervo2/cuervo1.png|model-002/cuervo2/cuervo2.png|model-002/cuervo2/cuervo3.png|model-002/cuervo2/cuervo4.png|model-002/cuervo2/cuervo5.png|model-002/cuervo2/cuervo6.png">
            <img src="model-002/cuervo2/cuervo1.png" alt="Raven, version two" />
            <footer><span>Cuervo 02</span><span>01—06</span></footer>
          </article>
        </div>
      </section>

      <section class="model-column" aria-labelledby="owl-title">
        <header class="model-heading">
          <span>Modelo 003</span>
          <h2 id="owl-title">Owls</h2>
        </header>

        <div class="motion-list">
          <article class="motion-stage" data-sequence data-frames="model-003/buho1/buho1.png|model-003/buho1/buho2.png|model-003/buho1/buho3.png|model-003/buho1/buho4.png|model-003/buho1/buho5.png|model-003/buho1/buho6.png">
            <img src="model-003/buho1/buho1.png" alt="Owl, version one" />
            <footer><span>Owl 01</span><span>01—06</span></footer>
          </article>
          <article class="motion-stage" data-sequence data-frames="model-003/buho2/buho1.png|model-003/buho2/buho2.png|model-003/buho2/buho3.png|model-003/buho2/buho4.png|model-003/buho2/buho5.png|model-003/buho2/buho6.png">
            <img src="model-003/buho2/buho1.png" alt="Owl, version two" />
            <footer><span>Owl 02</span><span>01—06</span></footer>
          </article>
        </div>
      </section>

      <section class="model-column model-column--books" aria-labelledby="book-title">
        <header class="model-heading">
          <span>Modelo 004</span>
          <h2 id="book-title">Libros</h2>
        </header>

        <div class="motion-list">
          <article class="motion-stage" data-sequence data-frames="model-004/libro1/libro1.png|model-004/libro1/libro2.png|model-004/libro1/libro3.png|model-004/libro1/libro4.png|model-004/libro1/libro5.png|model-004/libro1/libro6.png">
            <img src="model-004/libro1/libro1.png" alt="Book, version one" />
            <footer><span>Libro 01</span><span>01—06</span></footer>
          </article>
          <article class="motion-stage" data-sequence data-frames="model-004/libro2/libro1.png|model-004/libro2/libro2.png|model-004/libro2/libro3.png|model-004/libro2/libro4.png|model-004/libro2/libro5.png|model-004/libro2/libro6.png">
            <img src="model-004/libro2/libro1.png" alt="Book, version two" />
            <footer><span>Libro 02</span><span>01—06</span></footer>
          </article>
          <article class="motion-stage" data-sequence data-frames="model-004/libro3/libro1.png|model-004/libro3/libro2.png|model-004/libro3/libro3.png|model-004/libro3/libro4.png|model-004/libro3/libro5.png|model-004/libro3/libro6.png">
            <img src="model-004/libro3/libro1.png" alt="Book, version three" />
            <footer><span>Libro 03</span><span>01—06</span></footer>
          </article>
        </div>
      </section>
    </main>

    <p class="sr-only" aria-live="polite" data-playback-status>All nine sequences are playing.</p>
    <script src="script.js"></script>
  </body>
</html>
