<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Interactive 3D Core</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="hero">

    <div class="copy">
      <span class="eyebrow">Interactive 3D</span>

      <h1>
        Touch the<br>
        object.
      </h1>

      <p>
        Haz clic o toca el objeto para cambiar su forma,
        material y comportamiento.
      </p>
    </div>


    <div
      class="scene-wrapper"
      id="scene-wrapper"
    >

      <canvas
        id="three-canvas"
        aria-label="Objeto tridimensional interactivo"
      ></canvas>


      <div class="interaction-hint">
        <span class="hint-dot"></span>
        Click / Tap
      </div>

    </div>


    <div class="state-indicator">
      <span id="state-number">01</span>

      <div class="state-line"></div>

      <span id="state-name">Orb</span>
    </div>

  </main>


  <script
    type="module"
    src="script.js"
  ></script>

</body>
</html>
