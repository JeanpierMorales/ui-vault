<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>UI Vault — Component repository</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./app/css/app.css" />
  </head>
  <body>
    <!--
      THESIS: The repository's working documents, not catalog cards, are the visual surface.
      OWN-WORLD: Quiet paper utilities recede behind the original component canvases.
      STORY: Explore real work at useful scale, then inspect, copy, or open its exact source.
      FIRST VIEWPORT: Fixed utilities above a live field of the repository's own interfaces.
      FORM: Experience-first archive; filesystem register as the single source of catalog truth.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div class="app-shell">
      <header class="topbar">
        <button class="brand" id="home-button" type="button" aria-label="Volver al inicio de UI Vault">
          <span class="brand-mark" aria-hidden="true">UV</span><span>UI Vault</span>
        </button>
        <label class="search-field" for="global-search">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
          <input id="global-search" type="search" placeholder="Buscar componentes…" autocomplete="off" /><kbd>⌘ K</kbd>
        </label>
        <div class="topbar-actions">
          <span class="component-count" id="component-count">0 componentes</span>
          <div class="view-toggle" role="group" aria-label="Cambiar vista">
            <button id="grid-view" class="is-active" type="button" aria-label="Vista de cuadrícula" aria-pressed="true"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"></rect><rect x="14" y="4" width="6" height="6"></rect><rect x="4" y="14" width="6" height="6"></rect><rect x="14" y="14" width="6" height="6"></rect></svg></button>
            <button id="list-view" type="button" aria-label="Vista de lista" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg></button>
          </div>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="Cambiar a modo oscuro"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path></svg></button>
          <button class="menu-button" id="menu-toggle" type="button" aria-label="Abrir navegación" aria-expanded="false" aria-controls="sidebar"><span></span><span></span></button>
        </div>
      </header>
      <aside class="sidebar" id="sidebar" aria-label="Navegación de componentes"><nav id="category-nav"></nav><div class="sidebar-foot"><p>El catálogo carga cada pieza en su propio documento.</p><span id="category-count">0 categorías activas</span></div></aside>
      <main class="workspace" id="workspace">
        <section class="catalog" id="catalog" aria-labelledby="page-title">
          <div class="catalog-head"><div><p class="path" id="page-path">Índice / todo el archivo</p><h1 id="page-title">Piezas del repositorio</h1></div><p class="result-note" id="result-note"></p></div>
          <div class="filter-line" id="filter-line" aria-label="Filtros rápidos"></div>
          <div class="gallery" id="gallery" aria-live="polite"></div>
          <div class="empty-state" id="empty-state" hidden><p>No hay coincidencias para esta búsqueda.</p><button type="button" id="clear-search">Limpiar filtros</button></div>
        </section>
        <section class="detail" id="detail" hidden aria-labelledby="detail-title">
          <div class="detail-head"><button class="back-button" id="back-to-catalog" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"></path><path d="M7 12h13"></path></svg><span id="back-label">Volver al catálogo</span></button><div class="detail-actions"><button class="text-button" id="open-preview" type="button">Abrir preview ↗</button><button class="text-button" id="fullscreen-preview" type="button">Pantalla completa</button></div></div>
          <div class="detail-title-row"><div><p class="path" id="detail-path"></p><h1 id="detail-title"></h1><p class="detail-description" id="detail-description"></p></div><span class="component-id" id="detail-id"></span></div>
          <div class="preview-stage" id="preview-stage"></div>
          <div class="source-area"><div class="source-tabs" id="source-tabs" role="tablist" aria-label="Código fuente"></div><div class="source-toolbar"><span id="source-file"></span><button class="copy-button" id="copy-source" type="button">Copiar código</button></div><pre class="source-code" id="source-panel" role="tabpanel"><code id="source-code"></code></pre></div>
        </section>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app/js/app.js"></script>
  </body>
</html>
