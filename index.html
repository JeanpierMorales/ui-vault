<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1ea" />
    <title>UI Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Montserrat:wght@800&display=swap" rel="stylesheet" />
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="./app/css/app.css" />
  </head>
  <body>
    <div class="vault-shell">
      <header class="topbar">
        <a class="brand" href="./index.html" aria-label="UI Vault">
          <span class="brand-mark" aria-hidden="true">UV</span><span>UI Vault</span>
        </a>
        <label class="search-field" for="component-search">
          <iconify-icon aria-hidden="true" icon="ph:magnifying-glass"></iconify-icon>
          <input id="component-search" type="search" placeholder="Buscar pieza o código" autocomplete="off" />
        </label>
        <div class="topbar-actions">
          <span id="library-total" class="library-count">0 piezas</span>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="Cambiar tema"><iconify-icon aria-hidden="true" icon="ph:moon-stars"></iconify-icon></button>
          <button class="menu-button" id="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="library-sidebar"><span></span><span></span></button>
        </div>
      </header>

      <main class="vault-main">
        <aside class="library-sidebar" id="library-sidebar" aria-label="Categorías">
          <nav id="category-nav" aria-label="Categorías disponibles"></nav>
        </aside>

        <section class="content-area" aria-label="Vista de piezas">
          <header class="content-head">
            <div>
              <span class="section-label" id="content-group">Foundations</span>
              <h1 id="content-title">Typography</h1>
            </div>
            <p id="content-count" class="content-count">0 piezas</p>
          </header>

          <div class="pieces" id="pieces"></div>
          <div class="pieces-empty" id="pieces-empty" hidden>
            <iconify-icon aria-hidden="true" icon="ph:magnifying-glass-minus"></iconify-icon>
            <p>No hay piezas que coincidan con la búsqueda.</p>
            <button id="clear-search" type="button">Limpiar búsqueda</button>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./app/js/app.js"></script>
  </body>
</html>
