<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MIRA — CTA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "DM Sans",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        background: #f4f3ee;
        color: #181816;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
      }

      .demo {
        min-height: 100vh;

        display: grid;
        place-items: center;

        background: #ecebe5;
        color: #94948e;

        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.16em;

        text-transform: uppercase;
      }

      .mira-cta {
        --bg: #171715;
        --text: #f5f4ee;
        --muted: rgba(245, 244, 238, 0.5);
        --line: rgba(255, 255, 255, 0.13);

        position: relative;

        min-height: 100vh;

        display: flex;
        align-items: center;

        overflow: hidden;

        background: var(--bg);
        color: var(--text);

        padding: 90px 40px;
      }

      /* subtle background geometry */

      .mira-cta::before,
      .mira-cta::after {
        content: "";

        position: absolute;

        top: 50%;
        left: 50%;

        border: 1px solid rgba(255, 255, 255, 0.045);

        border-radius: 50%;

        transform: translate(-50%, -50%);

        pointer-events: none;
      }

      .mira-cta::before {
        width: 650px;
        height: 650px;
      }

      .mira-cta::after {
        width: 980px;
        height: 980px;

        border-color: rgba(255, 255, 255, 0.025);
      }

      .mira-cta__inner {
        position: relative;
        z-index: 2;

        width: min(1250px, 100%);

        margin: 0 auto;

        text-align: center;
      }

      .mira-cta__eyebrow {
        margin-bottom: 30px;

        color: var(--muted);

        font-size: 9px;
        font-weight: 700;

        letter-spacing: 0.18em;
      }

      .mira-cta__title {
        max-width: 1100px;

        margin: 0 auto;

        font-family: "Manrope", sans-serif;

        font-size: clamp(58px, 8vw, 126px);

        font-weight: 500;

        line-height: 0.88;

        letter-spacing: -0.075em;
      }

      .mira-cta__title span {
        display: block;

        color: rgba(245, 244, 238, 0.34);
      }

      .mira-cta__copy {
        max-width: 560px;

        margin: 38px auto 0;

        color: rgba(245, 244, 238, 0.56);

        font-size: 14px;

        line-height: 1.7;
      }

      .mira-cta__actions {
        display: flex;

        justify-content: center;
        align-items: center;

        gap: 14px;

        margin-top: 45px;
      }

      .mira-cta__primary,
      .mira-cta__secondary {
        text-decoration: none;

        transition:
          transform 350ms cubic-bezier(0.22, 1, 0.36, 1),
          background 300ms ease,
          color 300ms ease,
          border-color 300ms ease;
      }

      .mira-cta__primary {
        min-width: 220px;

        display: inline-flex;

        align-items: center;
        justify-content: space-between;

        gap: 36px;

        padding: 17px 20px 17px 22px;

        background: #f5f4ee;

        color: #181816;

        font-size: 12px;
        font-weight: 600;
      }

      .mira-cta__primary span {
        font-size: 18px;

        transition: transform 350ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .mira-cta__primary:hover {
        transform: translateY(-3px);
      }

      .mira-cta__primary:hover span {
        transform: translateX(5px);
      }

      .mira-cta__secondary {
        padding: 16px 20px;

        color: rgba(245, 244, 238, 0.72);

        font-size: 11px;
        font-weight: 500;

        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .mira-cta__secondary:hover {
        color: #ffffff;

        border-color: rgba(255, 255, 255, 0.7);

        transform: translateY(-2px);
      }

      .mira-cta__footer {
        max-width: 850px;

        margin: 92px auto 0;

        display: grid;

        grid-template-columns:
          auto
          1fr
          auto
          1fr
          auto
          1fr
          auto;

        gap: 14px;

        align-items: center;
      }

      .mira-cta__footer span {
        color: rgba(245, 244, 238, 0.36);

        font-size: 8px;
        font-weight: 700;

        letter-spacing: 0.15em;

        white-space: nowrap;
      }

      .mira-cta__footer i {
        display: block;

        height: 1px;

        background: var(--line);
      }

      @media (max-width: 760px) {
        .mira-cta {
          min-height: 90vh;

          padding: 80px 24px;
        }

        .mira-cta__title {
          font-size: clamp(48px, 15vw, 74px);
        }

        .mira-cta__copy {
          max-width: 390px;

          font-size: 13px;
        }

        .mira-cta__actions {
          flex-direction: column;

          align-items: stretch;

          max-width: 320px;

          margin: 38px auto 0;
        }

        .mira-cta__primary {
          width: 100%;
        }

        .mira-cta__secondary {
          text-align: center;
        }

        .mira-cta__footer {
          grid-template-columns: 1fr;

          gap: 12px;

          margin-top: 70px;

          text-align: center;
        }

        .mira-cta__footer i {
          width: 1px;
          height: 18px;

          margin: 0 auto;
        }
      }
    </style>
  </head>

  <body>
    <section class="demo">Previous section</section>

    <section class="mira-cta">
      <div class="mira-cta__inner">
        <div class="mira-cta__eyebrow">READY WHEN YOU ARE</div>

        <h1 class="mira-cta__title">
          Your book deserves
          <span>more than being posted once.</span>
        </h1>

        <p class="mira-cta__copy">
          Build a publishing system around your stories — without letting
          marketing take over your writing life.
        </p>

        <div class="mira-cta__actions">
          <a href="#" class="mira-cta__primary">
            Start with MIRA
            <span aria-hidden="true"> → </span>
          </a>

          <a href="#" class="mira-cta__secondary"> Explore Done For You </a>
        </div>

        <div class="mira-cta__footer">
          <span> CREATE </span>

          <i></i>

          <span> ORGANIZE </span>

          <i></i>

          <span> PUBLISH </span>

          <i></i>

          <span> KEEP WRITING </span>
        </div>
      </div>
    </section>

    <section class="demo">Next section</section>
  </body>
</html>
