  <title>Liquid Glass Navigation</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <nav

      id="liquidNav"
      aria-label="Navegación principal"

      <!-- brillo dinámico -->
      <div class="nav-light" aria-hidden="true"></div>

      <!-- inicio -->
      <a
        href="#home"
        class="nav-logo"
        aria-label="Inicio"
      >
        <span class="nav-logo-inner">

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              d="M19.4 4.6c-3.7-3.7-9.8-3.7-13.5 0C2.3 8.2
              2.2 14 5.6 17.7c3 3.3 7.8 4 11.6 1.7l2.3

              2.5l.9-.6c.4-.3.9-.2 1.2.1l1.4 1.5c.3.3.3.7.1 1.1Z"
            />
          </svg>

        </span>
      </a>


      <!-- links -->
      <div class="nav-links">

        <a href="#work" class="nav-link">
          Work
        </a>

        <a href="#about" class="nav-link">
          About
        </a>

        <a href="#playground" class="nav-link">
          Playground
        </a>

        <a href="#resource" class="nav-link">
          Resource
        </a>

      </div>


      <!-- contacto -->
      <a
        href="mailto:hiyaet@gmail.com"
        class="nav-contact"
      >

        <span class="contact-text">
          hiyaet@gmail.com
        </span>

        <span class="contact-arrow">
          ↗
        </span>

      </a>

    </nav>

  </main>


  <script src="script.js"></script>

</body>
</html>
