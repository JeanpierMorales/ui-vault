<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MIRA Navbar</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main class="page">

    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <nav class="mira-navbar" id="miraNavbar">

      <!-- BRAND -->
      <a
        href="#home"
        class="brand-button"
        aria-label="MIRA Home"
      >
        M
      </a>


      <!-- MENU -->
      <div
        class="nav-menu"
        id="navMenu"
      >

        <!-- indicador deslizante -->
        <span
          class="nav-active-bg"
          id="navActiveBg"
          aria-hidden="true"
        ></span>


        <a
          href="#home"
          class="nav-link"
          data-nav
        >
          Home
        </a>


        <a
          href="#how"
          class="nav-link"
          data-nav
        >
          How it works
        </a>


        <a
          href="#create"
          class="nav-link"
          data-nav
        >
          Create
        </a>


        <a
          href="#booketeer"
          class="nav-link active"
          data-nav
        >
          Booketeer
        </a>


        <a
          href="#analytics"
          class="nav-link"
          data-nav
        >
          Analytics
        </a>


        <a
          href="#pricing"
          class="nav-link"
          data-nav
        >
          Pricing
        </a>

      </div>


      <!-- DIVIDER -->
      <div class="nav-divider"></div>


      <!-- CTA -->
      <a
        href="#contact"
        class="nav-cta"
      >

        <span>
          Let’s talk
        </span>

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M5 12h14M13 6l6 6-6 6"
          />
        </svg>

      </a>

    </nav>



    <!-- =====================================================
         DEMO SECTIONS
    ====================================================== -->

    <section
      id="home"
      class="section section-light"
    >
      <h1>
        TikTok marketing<br>
        for authors.
      </h1>
    </section>


    <section
      id="how"
      class="section section-gray"
    >
      <h2>
        How MIRA works
      </h2>
    </section>


    <section
      id="create"
      class="section section-light"
    >
      <h2>
        Create content
      </h2>
    </section>


    <section
      id="booketeer"
      class="section section-gray"
    >
      <h2>
        Booketeer
      </h2>
    </section>


    <section
      id="analytics"
      class="section section-light"
    >
      <h2>
        Analytics
      </h2>
    </section>


    <section
      id="pricing"
      class="section section-gray"
    >
      <h2>
        Pricing
      </h2>
    </section>


    <section
      id="contact"
      class="section section-dark"
    >
      <h2>
        Let’s talk
      </h2>
    </section>

  </main>


  <script src="script.js"></script>
</body>
</html>
