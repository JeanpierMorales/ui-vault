<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Clean Glass Navbar</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- =====================================================
       NAVBAR
  ====================================================== -->

  <nav class="navbar">

    <!-- BRAND -->
    <a href="#inicio" class="brand">
      MIRA
    </a>


    <!-- NAVIGATION -->
    <div class="nav-links">

      <a href="#inicio">
        Inicio
      </a>

      <a href="#como-funciona">
        Cómo funciona
      </a>

      <a href="#features">
        Features
      </a>

      <a href="#pricing">
        Pricing
      </a>

      <a href="#recursos">
        Recursos
      </a>

    </div>


    <!-- RIGHT -->
    <div class="nav-actions">

      <!-- SEARCH -->
      <form class="search-box">

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <circle
            cx="11"
            cy="11"
            r="7"
          />

          <path
            d="M20 20l-4-4"
          />
        </svg>

        <input
          type="search"
          placeholder="Buscar..."
          aria-label="Buscar"
        />

      </form>


      <!-- CONTACT -->
      <a
        href="#contacto"
        class="contact-button"
      >
        Contacto

        <svg
          viewBox="0 0 24 24"
        >
          <path
            d="M5 12h14M13 6l6 6-6 6"
          />
        </svg>
      </a>

    </div>

  </nav>



  <!-- =====================================================
       DEMO BACKGROUND
       Solo para que veas la transparencia del navbar.
  ====================================================== -->

  <main>

    <section
      class="hero"
      id="inicio"
    >

      <div class="hero-copy">

        <span>
          Creative platform
        </span>

        <h1>
          Clean interfaces.<br>
          Better systems.
        </h1>

      </div>


      <!-- cards detrás del navbar -->

      <div class="cards">

        <article class="card card-1">
          <span>01</span>

          <h2>
            Content
          </h2>
        </article>


        <article class="card card-2">
          <span>02</span>

          <h2>
            Campaigns
          </h2>
        </article>


        <article class="card card-3">
          <span>03</span>

          <h2>
            Analytics
          </h2>
        </article>

      </div>

    </section>



    <section
      id="como-funciona"
      class="demo-section"
    >
      Cómo funciona
    </section>


    <section
      id="features"
      class="demo-section alt"
    >
      Features
    </section>


    <section
      id="pricing"
      class="demo-section"
    >
      Pricing
    </section>


    <section
      id="recursos"
      class="demo-section alt"
    >
      Recursos
    </section>


    <section
      id="contacto"
      class="demo-section dark"
    >
      Contacto
    </section>

  </main>

</body>
</html>
