<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Skeleton Component Library</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="page">

    <!-- ========================= -->
    <!-- TOP -->
    <!-- ========================= -->

    <header class="page-header">

      <div>
        <span class="micro">LOADING STATES</span>

        <h1>Skeleton components</h1>

        <p>
          A monochrome collection of loading structures for modern interfaces.
        </p>
      </div>

      <div class="loading-status">
        <span class="status-dot"></span>
        Loading interface
      </div>

    </header>


    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <section class="demo demo-wide">

      <div class="demo-name">
        Navigation
      </div>

      <div class="component navigation-skeleton">

        <div class="sk logo-sk"></div>

        <div class="nav-center">
          <div class="sk nav-item"></div>
          <div class="sk nav-item"></div>
          <div class="sk nav-item short"></div>
          <div class="sk nav-item"></div>
        </div>

        <div class="sk nav-button"></div>

      </div>

    </section>


    <!-- ========================= -->
    <!-- HERO -->
    <!-- ========================= -->

    <section class="demo demo-wide">

      <div class="demo-name">
        Hero
      </div>

      <div class="component hero-skeleton">

        <div class="hero-copy">

          <div class="sk hero-eyebrow"></div>

          <div class="sk hero-title"></div>
          <div class="sk hero-title second"></div>

          <div class="hero-paragraph">
            <div class="sk text-line"></div>
            <div class="sk text-line"></div>
            <div class="sk text-line short"></div>
          </div>

          <div class="hero-actions">
            <div class="sk hero-button"></div>
            <div class="sk hero-button secondary"></div>
          </div>

        </div>

        <div class="sk hero-media"></div>

      </div>

    </section>


    <!-- ========================= -->
    <!-- CARDS -->
    <!-- ========================= -->

    <section class="demo demo-wide">

      <div class="demo-name">
        Cards
      </div>

      <div class="three-columns">

        <article class="component card-skeleton">

          <div class="sk card-image"></div>

          <div class="card-body">

            <div class="sk tiny-line"></div>

            <div class="sk title-line"></div>

            <div class="text-group">
              <div class="sk text-line"></div>
              <div class="sk text-line"></div>
              <div class="sk text-line medium"></div>
            </div>

            <div class="sk card-action"></div>

          </div>

        </article>


        <article class="component card-skeleton">

          <div class="sk card-image"></div>

          <div class="card-body">

            <div class="sk tiny-line"></div>

            <div class="sk title-line medium"></div>

            <div class="text-group">
              <div class="sk text-line"></div>
              <div class="sk text-line"></div>
              <div class="sk text-line short"></div>
            </div>

            <div class="sk card-action"></div>

          </div>

        </article>


        <article class="component card-skeleton">

          <div class="sk card-image"></div>

          <div class="card-body">

            <div class="sk tiny-line"></div>

            <div class="sk title-line"></div>

            <div class="text-group">
              <div class="sk text-line"></div>
              <div class="sk text-line medium"></div>
              <div class="sk text-line small"></div>
            </div>

            <div class="sk card-action"></div>

          </div>

        </article>

      </div>

    </section>


    <!-- ========================= -->
    <!-- FORM + PROFILE -->
    <!-- ========================= -->

    <section class="grid-2">

      <!-- FORM -->

      <div class="demo">

        <div class="demo-name">
          Form
        </div>

        <div class="component form-skeleton">

          <div class="sk form-heading"></div>

          <div class="form-description">
            <div class="sk text-line"></div>
            <div class="sk text-line medium"></div>
          </div>

          <div class="field">
            <div class="sk field-label"></div>
            <div class="sk input"></div>
          </div>

          <div class="field">
            <div class="sk field-label small"></div>
            <div class="sk input"></div>
          </div>

          <div class="field-row">

            <div class="field">
              <div class="sk field-label"></div>
              <div class="sk input"></div>
            </div>

            <div class="field">
              <div class="sk field-label small"></div>
              <div class="sk input"></div>
            </div>

          </div>

          <div class="field">
            <div class="sk field-label"></div>
            <div class="sk textarea"></div>
          </div>

          <div class="form-footer">
            <div class="sk checkbox"></div>
            <div class="sk checkbox-text"></div>

            <div class="sk submit"></div>
          </div>

        </div>

      </div>


      <!-- PROFILE -->

      <div class="demo">

        <div class="demo-name">
          Profile
        </div>

        <div class="component profile-skeleton">

          <div class="profile-top">

            <div class="sk avatar-large"></div>

            <div class="profile-info">
              <div class="sk profile-name"></div>
              <div class="sk profile-description"></div>
              <div class="sk profile-description short"></div>
            </div>

          </div>

          <div class="profile-stats">

            <div class="profile-stat">
              <div class="sk stat-number"></div>
              <div class="sk stat-label"></div>
            </div>

            <div class="profile-stat">
              <div class="sk stat-number"></div>
              <div class="sk stat-label short"></div>
            </div>

            <div class="profile-stat">
              <div class="sk stat-number"></div>
              <div class="sk stat-label"></div>
            </div>

          </div>

          <div class="profile-content">

            <div class="sk profile-card"></div>
            <div class="sk profile-card"></div>

          </div>

        </div>

      </div>

    </section>


    <!-- ========================= -->
    <!-- DASHBOARD -->
    <!-- ========================= -->

    <section class="demo demo-wide">

      <div class="demo-name">
        Dashboard
      </div>

      <div class="component dashboard">

        <aside class="dashboard-sidebar">

          <div class="sk dashboard-logo"></div>

          <div class="sidebar-menu">

            <div class="sidebar-line">
              <div class="sk menu-icon"></div>
              <div class="sk menu-text"></div>
            </div>

            <div class="sidebar-line">
              <div class="sk menu-icon"></div>
              <div class="sk menu-text short"></div>
            </div>

            <div class="sidebar-line">
              <div class="sk menu-icon"></div>
              <div class="sk menu-text"></div>
            </div>

            <div class="sidebar-line">
              <div class="sk menu-icon"></div>
              <div class="sk menu-text medium"></div>
            </div>

            <div class="sidebar-line">
              <div class="sk menu-icon"></div>
              <div class="sk menu-text"></div>
            </div>

          </div>

        </aside>


        <div class="dashboard-main">

          <div class="dashboard-header">

            <div>

              <div class="sk dashboard-title"></div>

              <div class="sk dashboard-subtitle"></div>

            </div>

            <div class="sk avatar-small"></div>

          </div>


          <div class="metrics">

            <div class="metric">
              <div class="sk metric-label"></div>
              <div class="sk metric-number"></div>
              <div class="sk metric-change"></div>
            </div>

            <div class="metric">
              <div class="sk metric-label"></div>
              <div class="sk metric-number short"></div>
              <div class="sk metric-change"></div>
            </div>

            <div class="metric">
              <div class="sk metric-label short"></div>
              <div class="sk metric-number"></div>
              <div class="sk metric-change short"></div>
            </div>

          </div>


          <div class="dashboard-bottom">

            <div class="chart">

              <div class="chart-header">
                <div class="sk chart-title"></div>
                <div class="sk chart-filter"></div>
              </div>

              <div class="bars">
                <div class="sk bar h1"></div>
                <div class="sk bar h2"></div>
                <div class="sk bar h3"></div>
                <div class="sk bar h4"></div>
                <div class="sk bar h5"></div>
                <div class="sk bar h6"></div>
                <div class="sk bar h7"></div>
                <div class="sk bar h8"></div>
                <div class="sk bar h9"></div>
              </div>

            </div>


            <div class="activity">

              <div class="sk activity-title"></div>

              <div class="activity-item">
                <div class="sk activity-avatar"></div>

                <div class="activity-copy">
                  <div class="sk activity-line"></div>
                  <div class="sk activity-line short"></div>
                </div>
              </div>

              <div class="activity-item">
                <div class="sk activity-avatar"></div>

                <div class="activity-copy">
                  <div class="sk activity-line medium"></div>
                  <div class="sk activity-line short"></div>
                </div>
              </div>

              <div class="activity-item">
                <div class="sk activity-avatar"></div>

                <div class="activity-copy">
                  <div class="sk activity-line"></div>
                  <div class="sk activity-line medium"></div>
                </div>
              </div>

            </div>

          </div>

        </div>

      </div>

    </section>


    <!-- ========================= -->
    <!-- LIST / FEED -->
    <!-- ========================= -->

    <section class="grid-2">

      <div class="demo">

        <div class="demo-name">
          Feed
        </div>

        <div class="component feed">

          <div class="feed-item">

            <div class="sk feed-avatar"></div>

            <div class="feed-content">

              <div class="feed-header">
                <div class="sk feed-name"></div>
                <div class="sk feed-date"></div>
              </div>

              <div class="sk feed-line"></div>
              <div class="sk feed-line"></div>
              <div class="sk feed-line short"></div>

            </div>

          </div>


          <div class="feed-item">

            <div class="sk feed-avatar"></div>

            <div class="feed-content">

              <div class="feed-header">
                <div class="sk feed-name short"></div>
                <div class="sk feed-date"></div>
              </div>

              <div class="sk feed-line"></div>
              <div class="sk feed-line medium"></div>

            </div>

          </div>


          <div class="feed-item">

            <div class="sk feed-avatar"></div>

            <div class="feed-content">

              <div class="feed-header">
                <div class="sk feed-name"></div>
                <div class="sk feed-date"></div>
              </div>

              <div class="sk feed-line"></div>
              <div class="sk feed-line"></div>
              <div class="sk feed-line short"></div>

            </div>

          </div>

        </div>

      </div>


      <!-- MEDIA -->

      <div class="demo">

        <div class="demo-name">
          Article
        </div>

        <div class="component article">

          <div class="sk article-image"></div>

          <div class="article-content">

            <div class="sk article-category"></div>

            <div class="sk article-title"></div>
            <div class="sk article-title second"></div>

            <div class="article-lines">
              <div class="sk text-line"></div>
              <div class="sk text-line"></div>
              <div class="sk text-line medium"></div>
            </div>

            <div class="author">
              <div class="sk author-avatar"></div>

              <div>
                <div class="sk author-name"></div>
                <div class="sk author-date"></div>
              </div>
            </div>

          </div>

        </div>

      </div>

    </section>


    <!-- ========================= -->
    <!-- TABLE -->
    <!-- ========================= -->

    <section class="demo demo-wide">

      <div class="demo-name">
        Table
      </div>

      <div class="component table-skeleton">

        <div class="table-toolbar">

          <div class="sk table-search"></div>

          <div class="table-actions">
            <div class="sk toolbar-button"></div>
            <div class="sk toolbar-button small"></div>
          </div>

        </div>

        <div class="table-row table-header">
          <div class="sk table-cell tiny"></div>
          <div class="sk table-cell"></div>
          <div class="sk table-cell medium"></div>
          <div class="sk table-cell small"></div>
          <div class="sk table-cell medium"></div>
        </div>

        <div class="table-row">
          <div class="sk row-checkbox"></div>

          <div class="person-cell">
            <div class="sk row-avatar"></div>

            <div>
              <div class="sk row-name"></div>
              <div class="sk row-sub"></div>
            </div>
          </div>

          <div class="sk row-text"></div>
          <div class="sk row-status"></div>
          <div class="sk row-text short"></div>
        </div>

        <div class="table-row">
          <div class="sk row-checkbox"></div>

          <div class="person-cell">
            <div class="sk row-avatar"></div>

            <div>
              <div class="sk row-name short"></div>
              <div class="sk row-sub"></div>
            </div>
          </div>

          <div class="sk row-text short"></div>
          <div class="sk row-status"></div>
          <div class="sk row-text"></div>
        </div>

        <div class="table-row">
          <div class="sk row-checkbox"></div>

          <div class="person-cell">
            <div class="sk row-avatar"></div>

            <div>
              <div class="sk row-name"></div>
              <div class="sk row-sub short"></div>
            </div>
          </div>

          <div class="sk row-text"></div>
          <div class="sk row-status"></div>
          <div class="sk row-text short"></div>
        </div>

      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
