        <a class="brand" href="#" aria-label="Estudio Pampa, inicio">

        <span class="title__half title__half--r" data-half="r">que respira</span>
      </h1>

      <p class="intro" data-intro>Casas de sillar en Arequipa. Muros de piedra volcánica blanca, patios y sombra.</p>

      <figure class="media" id="proyecto" data-media>
        <div class="media__frame" data-frame>
          <img class="media__img media__img--a" data-img-a

          <img class="media__img media__img--b" data-img-b
               src="https://images.unsplash.com/photo-1708184292458-ca9d13e7d96f?auto=format&fit=crop&w=2200&q=80"
