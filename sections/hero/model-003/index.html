<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="KANZO Digital Studio — Websites, software and AI products built with purpose.">
  <title>KANZO — Digital Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<main class="hero" id="hero">

  <!-- MAIN VISUAL -->
  <div class="visual-shell">

    <figure class="hero-slide active">
      <img
        src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1800&q=90"
        alt="Web development workspace">
    </figure>

    <figure class="hero-slide">
      <img
        src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=1800&q=90"
        alt="Software development">
    </figure>

    <figure class="hero-slide">
      <img
        src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1800&q=90"
        alt="Digital product workspace">
    </figure>

    <div class="visual-overlay"></div>

    <div class="callout callout-main">
      <span class="callout-dot"></span>
      <span id="calloutTitle">Web platforms</span>
    </div>

    <div class="callout callout-small">
      Built with purpose
    </div>

    <div class="service-tags">
      <button>Websites</button>
      <button>Software</button>
      <button>UX / UI</button>
      <button>AI</button>
      <button>Automation</button>
      <button>Strategy</button>
    </div>

  </div>


  <!-- NAV -->
  <nav class="navbar">

    <a href="#" class="brand" aria-label="KANZO">
      <span class="brand-mark"></span>
    </a>

    <a class="active" href="#">Home</a>
    <a href="#">Projects</a>
    <a href="#">About</a>
    <a href="#">Pricing</a>

  </nav>


  <!-- CTA TOP -->
  <a class="contact-cta" href="#contact">
    <span>Start project</span>
    <i>↗</i>
  </a>


  <!-- HEADLINE -->
  <section class="hero-copy">

    <span class="eyebrow">KANZO DIGITAL STUDIO</span>

    <h1>
      WEBS THAT CONVERT.<br>
      SOFTWARE THAT SCALES.<br>
      AI THAT WORKS.
    </h1>

  </section>


  <!-- THUMBNAILS -->
  <div class="thumbnails">

    <button class="thumb active" data-slide="0" aria-label="Show web project">
      <img
        src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=500&q=85"
        alt="">
    </button>

    <button class="thumb" data-slide="1" aria-label="Show software project">
      <img
        src="https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=500&q=85"
        alt="">
    </button>

    <button class="thumb" data-slide="2" aria-label="Show digital product">
      <img
        src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=500&q=85"
        alt="">
    </button>

  </div>


  <!-- THUMB CONTROLS -->
  <div class="thumb-controls">

    <button id="prevBtn" aria-label="Previous slide">←</button>

    <button id="nextBtn" aria-label="Next slide">→</button>

  </div>


  <!-- BOTTOM COPY -->
  <div class="bottom-copy">

    <p>
      We design and build digital experiences
      where clarity, technology and business
      come together.
    </p>

    <strong>
      Inspired by Kanso.<br>
      Built with purpose.
    </strong>

  </div>


  <!-- INDEX -->
  <div class="slide-index">
    <span id="currentSlide">01</span>
    <i></i>
    <span>03</span>
  </div>

</main>

<script src="script.js"></script>

</body>
</html>
