<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CALORI — Personal Meal Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="page">
<section class="hero">

<img class="hero-bg" src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?auto=format&fit=crop&w=2200&q=92" alt="Fresh pasta meal">

<div class="shade"></div>

<header class="navbar">
<a href="#" class="logo">CALORI</a>

<nav>
<a href="#">Menu</a>
<a href="#">Process</a>
<a href="#">About Us</a>
<a href="#">Team</a>
<a href="#">Contacts</a>
<a href="#">Account</a>
</nav>

<div class="nav-actions">
<button class="lang">English <span>⌄</span></button>
<a href="#" class="plans">See Plans</a>
</div>
</header>

<section class="planner">

<div class="planner-copy">
<p class="eyebrow">PERSONAL MEAL PLAN</p>
<h1>Set Your<br>Preferences</h1>
<p class="subcopy">If you prefer one-time order we have Ready-to-eat Meals</p>
</div>

<div class="planner-options">

<div class="option-group">
<div class="label">Starting Week <span class="info">i</span></div>
<div class="choices">
<button class="choice active">19.05</button>
<button class="choice">26.05</button>
<button class="choice">02.06</button>
</div>
</div>

<div class="option-group">
<div class="label">Days per Week</div>
<div class="choices">
<button class="choice active">5 days</button>
<button class="choice compact">6</button>
<button class="choice compact">7</button>
</div>
</div>

<div class="option-group">
<div class="label">Diet Preferences</div>
<div class="choices">
<button class="choice active">Mixed</button>
<button class="choice">Vegetarian</button>
</div>
</div>

<div class="option-group">
<div class="label">Calories a Day</div>
<div class="choices">
<button class="choice active">1500 kcal</button>
<button class="choice">2000</button>
<button class="choice">2500</button>
</div>
</div>

<div class="option-group allergies-group">
<div class="label">Allergies</div>
<div class="allergies-row">

<button class="allergy-picker">
You Have <span class="count">2</span> <span class="arrow">⌄</span>
</button>

<div class="tag">Nuts <button>×</button></div>
<div class="tag">Lactose Intolerance <button>×</button></div>

</div>
</div>

</div>

</section>

</section>
</main>

<script src="script.js"></script>
</body>
</html>
