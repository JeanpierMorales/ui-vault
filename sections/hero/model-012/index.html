<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Flash Hero</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<main class="page">

  <section class="hero" id="hero">

    <div class="hero-shell">

      <!-- DECORACIÓN DE FONDO -->
      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>
      <div class="orbit orbit-three"></div>

      <!-- NAV -->
      <header class="hero-nav">

        <a href="#" class="logo">
          <span class="logo-icon">
            <svg viewBox="0 0 40 40">
              <circle cx="20" cy="20" r="18"></circle>
              <path d="M12 13h9l-4 7h9L16 30l3-8h-8z"></path>
            </svg>
          </span>

          <span>Flash.co</span>
        </a>

        <nav class="nav-links">
          <a href="#">Features</a>
          <a href="#">Article</a>
          <a href="#">Testimonials</a>
          <a href="#">About</a>
          <a href="#">Contacts</a>
        </nav>

        <a href="#" class="reserve-btn">
          Reserve id
        </a>

        <button class="menu-btn" aria-label="Open menu">
          <span></span>
          <span></span>
        </button>

      </header>


      <!-- TITULAR -->
      <div class="hero-heading">
        <h1>
          <span>Welcome</span>
          <span class="line-two">To Flash</span>
        </h1>
      </div>


      <!-- TEXTO IZQUIERDO -->
      <div class="left-copy">
        <p>
          The ultimate shopping
          <br>
          hack is here.
        </p>
      </div>


      <!-- ELEMENTOS FLOTANTES -->
      <div class="float-card float-card-left">

        <span class="triangle triangle-left"></span>

        <div class="float-icon">
          <svg viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="18"></circle>
            <path d="M12 13h9l-4 7h9L16 30l3-8h-8z"></path>
          </svg>
        </div>

        <span class="triangle triangle-right"></span>

      </div>


      <!-- VISUAL CENTRAL -->
      <div class="visual">

        <div class="visual-glow"></div>

        <div class="phone-skeleton"></div>

        <img
          src="assets/phone-hand.webp"
          alt="Hand holding Flash mobile application"
          class="phone-image"
        >

      </div>


      <!-- COLUMNA DERECHA -->
      <div class="right-content">

        <div class="avatar-wrap">
          <img
            src="assets/avatar.webp"
            alt="Flash user"
            class="avatar"
          >
        </div>

        <p class="right-copy">
          Bye bye spam. Say hello to rewarding
          rewards. Adios tracking nightmares.
        </p>

        <div class="stores">

          <a href="#" class="store-btn">
            <svg viewBox="0 0 24 24">
              <path d="M16.6 13.4c0-2.1 1.8-3.2 1.9-3.3-1-.1-2.2.6-2.7.6-.5 0-1.4-.6-2.3-.6-1.2 0-2.3.7-2.9 1.7-1.2 2.1-.3 5.3.9 7 .6.8 1.3 1.7 2.2 1.7.9 0 1.3-.6 2.4-.6 1.1 0 1.4.6 2.4.6 1 0 1.6-.8 2.2-1.7.7-1 1-2 1-2.1-.1 0-2.1-.8-2.1-3.3zM15.1 9.1c.5-.6.9-1.5.8-2.4-.8 0-1.8.6-2.4 1.2-.5.6-.9 1.4-.8 2.3.9.1 1.8-.4 2.4-1.1z"></path>
            </svg>

            <span>App Store</span>
          </a>

          <a href="#" class="store-btn">
            <svg viewBox="0 0 24 24">
              <path d="M4 3.8v16.4c0 .7.7 1.1 1.3.7l9.8-8.2c.4-.3.4-.9 0-1.2L5.3 3.1C4.7 2.7 4 3.1 4 3.8z"></path>
            </svg>

            <span>Google Play</span>
          </a>

        </div>

      </div>


      <!-- PEQUEÑOS ELEMENTOS DECORATIVOS -->
      <div class="mini-square square-one"></div>
      <div class="mini-square square-two"></div>

    </div>

  </section>

</main>

<script src="script.js"></script>

</body>
</html>
