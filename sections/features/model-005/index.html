<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>KANZO — Digital Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="preloader" class="preloader">
    <div id="grid" class="preloader-grid"></div>

    <div class="preloader-brand">
      <div class="brand-mark">KANZO</div>
      <div class="brand-subtitle">DIGITAL STUDIO</div>
    </div>
  </div>

  <main class="site">
    <section class="hero">
      <div class="hero-content">
        <p class="eyebrow">KANZO DIGITAL STUDIO</p>

        <h1>
          We build digital
          <span>experiences with purpose.</span>
        </h1>

        <p class="hero-description">
          Websites, digital products and intelligent systems designed
          with clarity, precision and intention.
        </p>

        <a href="#" class="hero-button">Start a project</a>
      </div>

      <div class="hero-visual">
        <div class="mock-window">
          <div class="mock-top">
            <span></span><span></span><span></span>
          </div>

          <div class="mock-content">
            <small>KANZO</small>
            <h2>Digital experiences<br>built differently.</h2>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
